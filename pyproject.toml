[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "theory5"
version = "0.1.0"
description = "Theory-5: A fermionic string-based framework for physical reality"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["theory5*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
